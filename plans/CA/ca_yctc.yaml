program: ca_yctc
state: CA
what: The Young Child Tax Credit is a California tax credit for families with a young child that can give you cash back or lower the tax you owe, claimed on your state tax return.
apply:
  - how: tax_return
    where: CalFile, free e-filing straight to the Franchise Tax Board
    url: https://www.ftb.ca.gov/file/ways-to-file/online/calfile/index.asp
  - how: in_person
    where: Free tax help at a VITA site
    url: https://www.ftb.ca.gov/help/free-tax-help/index.html
  - how: tax_return
    where: Your California return with form FTB 3514 attached, if you file on paper
    url: https://www.ftb.ca.gov/file/personal/credits/young-child-tax-credit.html
bring:
  - Photo ID for you and your spouse
  - Social Security cards or ITIN letters for you, your spouse and your children
  - Birth dates for everyone in your household
  - W-2s and 1099s for any work income
  - Bank routing and account numbers for direct deposit
next:
  - File your California return and claim the credit on form FTB 3514, the same form as CalEITC, or follow your tax software's steps.
  - A refund normally takes up to three weeks if you e-file, or up to three months on paper; some returns need extra review.
  - Check your refund on FTB's Where's my refund page with your Social Security number, ZIP code and exact refund amount.
watch_out:
  - You only get the credit by filing a California tax return.
  - VITA sites are generally open February through May, so plan ahead for free help.
  - You can claim it for past years back to tax year 2021 by filing or amending those returns.
  - CalFile needs a MyFTB account, and you can only register if you filed a California return in one of the last five years.
handoff: https://www.ftb.ca.gov/file/ways-to-file/online/calfile/index.asp
sources:
  - https://www.ftb.ca.gov/file/personal/credits/young-child-tax-credit.html
  - https://www.ftb.ca.gov/file/personal/credits/caleitc/index.html
  - https://www.ftb.ca.gov/file/ways-to-file/online/calfile/index.asp
  - https://www.ftb.ca.gov/help/free-tax-help/index.html
  - https://www.irs.gov/individuals/checklist-for-free-tax-return-preparation
  - https://www.ftb.ca.gov/refund/index.asp
last_verified: 2026-10-01
