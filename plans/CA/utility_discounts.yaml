programs: [ca_care, ca_fera]
state: CA
what: CARE is a monthly discount on your electric and natural gas bills, and FERA a monthly discount on your electric bill, both applied for through your own utility company.
apply: [cpuc_care_fera, pge_care_fera, sce_care_fera, sdge_care_fera, socalgas_care]
bring:
  - Your utility bill, for your account number
  - The number of people in your home and your household's total income
next:
  - PG&E, SCE and SDG&E don't ask for income proof when you apply.
  - At PG&E the discount shows up on your next bill.
  - You may be picked later to prove your income; answer by the deadline or the discount stops.
  - At PG&E and SDG&E the discount lasts two years, or four on a fixed income, and then you renew when asked.
watch_out:
  - At PG&E one form covers CARE and FERA; at SDG&E a CARE application is checked for FERA automatically.
  - The bill must be in your name, at the home where you mainly live.
  - If your apartment or mobile home is sub-metered, use the utility's separate sub-metered tenant form.
  - Tell your utility if you no longer qualify; SoCalGas asks within 30 days.
  - Very high energy use can get you removed from the program.
not_calculated:
  - Your electric or gas company is one of the utilities listed here (FERA is only for PG&E, SCE or SDG&E customers).
handoff: https://www.cpuc.ca.gov/industries-and-topics/electrical-energy/electric-costs/care-fera-program
sources:
  - https://www.cpuc.ca.gov/industries-and-topics/electrical-energy/electric-costs/care-fera-program
