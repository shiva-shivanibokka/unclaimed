programs: [lifeline]
state: CA
what: California LifeLine is the state's discount on a home phone or cell phone bill, run by the CPUC and separate from the federal Lifeline program.
apply: [ca_lifeline_provider, ca_lifeline_call_center, lifeline_national_verifier]
bring:
  - A card, notice or letter showing someone in your home is in a program like Medi-Cal, CalFresh, WIC or SSI
  - Or the front page of last year's state, federal or tribal tax return
  - Or pay stubs or income statements for three months in a row from the past year
  - Or benefit statements such as Social Security, unemployment or pension
next:
  - Ask the phone company for California LifeLine; you then get an application with a due date.
  - Send copies of your proof with the signed application, online or by mail, before the due date.
  - You pay regular rates until approved, then get a bill credit back to when you asked to enroll.
  - Every year you get a renewal form in a pink envelope; renew online or by mail to keep the discount.
  - For application or renewal questions, call the LifeLine Administrator at 1-877-858-7463.
watch_out:
  - Since Feb. 1, 2026, California LifeLine and federal Lifeline need two separate enrollments to get both; federal Lifeline is a separate enrollment through the National Verifier.
  - An incomplete or unsigned form gets sent back to you as a new form, which delays approval.
  - If you don't renew by the due date, you are dropped and charged regular rates.
handoff: https://www.californialifeline.com/
sources:
