program: medicaid
state: CA
what: Medi-Cal is California's health coverage for people with limited incomes, including health, dental and vision care at little or no cost.
apply:
  - how: online
    where: Covered California (one application checks Medi-Cal too)
    url: https://apply.coveredca.com/static/lw-web/account-creation/choose-application
  - how: phone
    where: Covered California, Monday to Friday, 8 a.m. to 6 p.m.
    url: https://www.coveredca.com/health/medi-cal/
    phone: "1-800-300-1506"
  - how: in_person
    where: A free certified enroller near you
    url: https://www.coveredca.com/get-help/find-an-enroller
bring:
  - Social Security numbers for everyone applying, if they have one
  - Federal tax information, if you file taxes
  - Immigration documents, for anyone who is not a citizen
  - Employer and income information for everyone who works
next:
  - You usually don't send papers up front; your details are checked against government records first.
  - If you qualify, a packet comes in the mail listing the health plans you can choose.
  - Pick a plan within 30 days, or Medi-Cal picks one for you.
  - After that, your county handles your Medi-Cal and any questions about it.
watch_out:
  - You can apply any time of year; there is no enrollment window for Medi-Cal.
  - Put the whole family on one application; kids may get Medi-Cal while parents get a Covered California plan.
  - Medi-Cal is run by the state and your county, not Covered California, so take coverage questions to your county.
handoff: https://apply.coveredca.com/static/lw-web/account-creation/choose-application
sources:
  - https://www.coveredca.com/health/medi-cal/
  - https://www.coveredca.com/apply/
  - https://www.coveredca.com/support/before-you-buy/when-to-apply-medi-cal/
  - https://www.coveredca.com/get-help/find-an-enroller
last_verified: 2026-10-01
