programs: [school_meals]
state: CA
what: Breakfast and lunch at school for your children, free or at a lower price.
apply: [ca_school]
bring:
  - The school's meal application form; ask the school or district for one.
  - Your household's income information.
  - Your CalFresh or CalWORKs details, if you get them.
next:
  - Hand the form to your child's school or district.
  - School or district staff review it before approving free or lower-price meals.
watch_out:
  - You can apply any time during the school year, not only when forms go home at the start.
  - If you get CalFresh or CalWORKs, your children may already qualify; ask the school if you still need a form.
  - Even though every California public school student eats free, many schools still collect meal forms (some use a different income form instead), so fill out the form your school sends.
  - If you get WIC or unemployment, ask the school about meals too.
handoff: https://www.fna.usda.gov/schoolmeals/model-application
sources:
  - https://www.fna.usda.gov/schoolmeals/model-application
  - https://www.cde.ca.gov/ls/nu/univmealsfaq.asp
last_verified: 2026-10-01
