program: chip
state: CA
what: In California, children's health coverage comes through Medi-Cal for Children, or a county children's program in some counties, using the same application as the rest of the family.
apply:
  - how: online
    where: Covered California (one application checks every family member)
    url: https://apply.coveredca.com/static/lw-web/account-creation/choose-application
  - how: phone
    where: Covered California, Monday to Friday, 8 a.m. to 6 p.m.
    url: https://www.coveredca.com/coverage-basics/medi-cal/children
    phone: "1-800-300-1506"
  - how: in_person
    where: A free certified enroller near you
    url: https://www.coveredca.com/get-help/find-an-enroller
bring:
  - Your household size and who lives with you
  - Income information for everyone in the household
  - Social Security numbers for family members, if they have one
  - Immigration documents, for anyone who is not a citizen
next:
  - Your results show which program each family member qualifies for.
  - The Medi-Cal or county children's program office contacts you with next steps.
  - If your child qualifies, a packet comes in the mail listing health plans to choose from.
  - Pick a plan within 30 days, or Medi-Cal picks one for you.
watch_out:
  - Apply for your child even if you think you won't qualify; a child can qualify for a different program than the parent.
  - You can apply for Medi-Cal any time of year.
handoff: https://apply.coveredca.com/static/lw-web/account-creation/choose-application
sources:
  - https://www.coveredca.com/coverage-basics/medi-cal/children
  - https://www.coveredca.com/health/medi-cal/
  - https://www.coveredca.com/apply/
  - https://www.coveredca.com/support/before-you-buy/when-to-apply-medi-cal/
  - https://www.coveredca.com/get-help/find-an-enroller
last_verified: 2026-10-01
