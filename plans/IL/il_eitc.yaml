program: il_eitc
state: IL
what: An Illinois tax credit for people who work, claimed on your state tax return, that can come back to you as a refund.
apply:
  - how: tax_return
    where: MyTax Illinois (free online filing of Form IL-1040, no account needed)
    url: https://mytax.illinois.gov/
  - how: tax_return
    where: Form IL-1040 with Schedule IL-E/EITC, filed on paper, by a tax preparer or with tax software
    url: https://tax.illinois.gov/forms/incometax/currentyear/individual/il-1040-schedule-il-e-eic-instr.html
bring:
  - Your completed federal tax return and schedules
  - W-2 and 1099 forms
  - Social Security numbers or ITINs for you and your children
  - Your bank routing and account numbers, for a faster direct-deposit refund
next:
  - Fill out Schedule IL-E/EITC and file it with your IL-1040.
  - Include a copy of pages 1 and 2 and Schedule 1 of your federal Form 1040.
  - The credit may result in a refund; filing online gets your refund faster.
watch_out:
  - File an Illinois return to get the credit even if you owe no tax or don't have to file.
  - If you did not get the federal EITC or have children with ITINs, complete the Expanded EITC Worksheet.
  - Mismatched names, Social Security numbers or ITINs can delay or deny your claim.
  - Missed it in a past year? File an amended IL-1040-X with Schedule IL-E/EITC.
handoff: https://mytax.illinois.gov/
sources:
  - https://tax.illinois.gov/programs/eitc.html
  - https://tax.illinois.gov/programs/eitc/other-faqs.html
  - https://tax.illinois.gov/research/publications/pubs/illinois-earned-income-tax-credit-information.html
  - https://tax.illinois.gov/programs/mytax/il-1040.html
  - https://tax.illinois.gov/forms/incometax/currentyear/individual/il-1040-schedule-il-e-eic-instr.html
last_verified: 2026-10-01
