program: il_liheap
state: IL
what: Once-a-year help paying your heating or electric bill, usually paid straight to your utility company.
apply:
  - how: online
    where: Help Illinois Families Request for Services form (DCEO)
    url: https://dceo.illinois.gov/communityservices/homeweatherization/communityactionagencies/helpillinoisfamilies.html
    phone: "1-833-711-0374"
  - how: in_person
    where: Your county's local LIHEAP agency (Where to Apply list)
    url: https://dceo.illinois.gov/communityservices/homeweatherization/communityactionagencies.html
bring:
  - Proof of the last 30 days of income for everyone in the household
  - Your most recent heating and/or electric bill from the last 30 days
  - Social Security card or ITIN for each person who has one
  - Your lease showing heat is included, the rent and your landlord's contact, if heat is in your rent
  - Proof of TANF, SNAP or medical benefits from IDHS, if you get them
next:
  - After the online form, your local agency emails you how to apply, often within a week to a month.
  - The agency reviews and confirms your eligibility and benefit.
  - You hear about approval or denial within 30 days of a complete application.
  - Payment goes to your utility within 45 days of approval, or to you if heat is in your rent.
watch_out:
  - Applications open October 1 for older adults, people with disabilities, families with young children and those facing shutoff; everyone else starts November 1.
  - Calling your county agency directly can be faster than the online form.
  - If your heat is shut off or you have a shutoff notice, ask about Reconnection Assistance.
  - Keep your seven-digit Application ID to check your status.
handoff: https://dceo.illinois.gov/communityservices/homeweatherization/communityactionagencies/helpillinoisfamilies.html
sources:
  - https://dceo.illinois.gov/communityservices/utilitybillassistance/howtoapply.html
  - https://dceo.illinois.gov/communityservices/utilitybillassistance/faqs.html
  - https://dceo.illinois.gov/communityservices/homeweatherization/communityactionagencies/helpillinoisfamilies.html
  - https://dceo.illinois.gov/communityservices/homeweatherization/communityactionagencies.html
