programs: [il_tanf]
state: IL
what: Monthly cash help for families with children or a pregnant woman, paid on an Illinois Link card or to your bank.
apply: [abe_online, idhs_helpline, idhs_office, idhs_paper_form]
bring:
  - Photo ID or other proof of who you are
  - Proof of where you live
  - Children's birth certificates
  - Social Security cards for everyone applying
  - Pay stubs and proof of any other income
next:
  - You have an interview where a caseworker goes over your answers.
  - The caseworker tells you what proof is still needed.
  - You make a Responsibility and Services Plan with your caseworker.
  - IDHS decides and tells you in writing within 45 days.
  - If approved, cash comes on an Illinois Link card or by direct deposit.
watch_out:
  - Your plan includes helping with child support, keeping kids in school and work activities.
  - Not cooperating with child support can take your name off the medical card.
  - Tell your caseworker about a new job, a move, family changes or a missed appointment.
  - Most TANF families can also get SNAP and medical help, so apply for those too.
  - If you are homeless, apply at the nearest Family Community Resource Center.
handoff: https://abe.illinois.gov/access/
sources:
