programs: [snap]
state: IL
what: Monthly money for groceries, loaded on an Illinois Link card you use at most grocery stores.
apply: [abe_online, idhs_helpline, idhs_office, idhs_paper_form]
bring:
  - Photo ID or other proof of who you are
  - Proof of where you live
  - Social Security numbers for everyone on the application
  - Pay stubs if you work
  - Proof of any other income or payments you get
next:
  - Your application starts the day IDHS gets it signed.
  - You have an interview, in person or by phone.
  - At the end of the interview, the caseworker tells you what proof is still needed.
  - You get a notice saying whether you are eligible; this can take up to a month.
  - If approved, benefits arrive each month on your Illinois Link card.
watch_out:
  - If you have almost no money for food now, ask for emergency SNAP, which is ready in 5 days or less.
  - Tell your caseworker when your income, household size or address changes.
  - Eligibility is reviewed from time to time, so watch your mail and answer on time.
handoff: https://abe.illinois.gov/access/
