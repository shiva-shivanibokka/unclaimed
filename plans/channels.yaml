# Ways to apply, each defined once and named by id in the cards (see README.md).
# `source` is the agency page that shows this url / phone.

# --- Every state ---
irs_free_file:
  how: tax_return
  where: IRS Free File (do your own federal return online for free)
  url: https://www.irs.gov/e-file-do-your-taxes-for-free
  source: https://www.irs.gov/e-file-do-your-taxes-for-free
vita_tce_locator:
  how: in_person
  where: Free tax help from IRS-certified volunteers (VITA or TCE site)
  url: https://freetaxassistance.for.irs.gov/s/sitelocator
  phone: "1-800-906-9887"
  source: https://www.irs.gov/individuals/free-tax-return-preparation-for-qualifying-taxpayers
ssa_online:
  how: online
  where: Social Security online application (some adults)
  url: https://secure.ssa.gov/iClaim/dib
  source: https://www.ssa.gov/apply/ssi
ssa_phone:
  how: phone
  where: Social Security (call to set up an appointment by phone or in person; TTY 1-800-325-0778)
  url: https://www.ssa.gov/apply/ssi
  phone: "1-800-772-1213"
  source: https://www.ssa.gov/apply/ssi
lifeline_national_verifier:
  how: online
  where: Lifeline National Verifier (FCC / USAC)
  url: https://getinternet.gov/apply?id=nv_home
  source: https://www.lifelinesupport.org/how-to-apply/
lifeline_support_center:
  how: mail
  where: Lifeline Support Center, PO Box 1000, Horseheads, NY 14845
  url: https://www.lifelinesupport.org/how-to-apply/
  phone: "1-800-234-9473"
  source: https://www.lifelinesupport.org/how-to-apply/

