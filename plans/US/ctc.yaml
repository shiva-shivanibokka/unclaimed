program: ctc
state: US
what: A federal tax credit for families with children, claimed when you file your federal tax return; part of it can come back as a refund.
apply:
  - how: tax_return
    where: IRS Free File (do your own federal return online for free)
    url: https://www.irs.gov/e-file-do-your-taxes-for-free
  - how: in_person
    where: Free tax help from IRS-certified volunteers (VITA or TCE site)
    url: https://freetaxassistance.for.irs.gov/s/sitelocator
    phone: "1-800-906-9887"
bring:
  - Photo ID for you, and your spouse if filing jointly.
  - Social Security cards for you, your spouse and each child.
  - All W-2 and 1099 forms from every job and other income.
  - Last year's federal and state tax returns, if you have them.
  - Bank routing and account numbers for direct deposit.
next:
  - If you claim the additional child tax credit, the IRS can't send that refund before mid-February, by law.
  - Check Where's My Refund? on IRS.gov; status shows a day after you e-file, or about four weeks after you mail a paper return.
  - Refunds with the additional child tax credit can take longer because the IRS reviews them more closely.
watch_out:
  - Claim it on Form 1040 with Schedule 8812 attached.
  - Don't claim a child someone else has already claimed; check the IRS tie-breaker rules.
handoff: https://www.irs.gov/e-file-do-your-taxes-for-free
sources:
  - https://www.irs.gov/credits-deductions/individuals/child-tax-credit
  - https://www.irs.gov/forms-pubs/about-schedule-8812-form-1040
  - https://www.irs.gov/tax-professionals/eitc-central/how-to-avoid-child-tax-credit-errors
  - https://www.irs.gov/refunds
  - https://www.irs.gov/filing/irs-free-file-do-your-taxes-for-free
  - https://www.irs.gov/e-file-do-your-taxes-for-free
  - https://www.irs.gov/individuals/free-tax-return-preparation-for-qualifying-taxpayers
  - https://www.irs.gov/individuals/checklist-for-free-tax-return-preparation
last_verified: 2026-10-01
