programs: [eitc, ctc]
state: US
what: Federal tax credits for working people and for families with children, claimed when you file your federal tax return; part of the child credit can come back as a refund.
apply: [irs_free_file, vita_tce_locator]
bring:
  - Photo ID for you, and your spouse if filing jointly.
  - Social Security cards for you, your spouse and each child or other dependent.
  - All W-2 and 1099 forms from every job and other income.
  - Last year's federal and state tax returns, if you have them.
  - Bank routing and account numbers for direct deposit.
next:
  - By law, the IRS can't send refunds that include the EITC or the additional child tax credit before mid-February.
  - E-file and choose direct deposit to get your refund faster.
  - Track your refund with Where's My Refund? on IRS.gov or the IRS app; status shows a day after you e-file, or about four weeks after you mail a paper return.
  - Refunds with the additional child tax credit can take longer because the IRS reviews them more closely.
  - If the IRS sends a letter about your EITC, don't ignore it; follow its directions and send what it asks for.
watch_out:
  - File Form 1040 to get them, even if you owe no tax; add Schedule EIC if you claim a child for the EITC, and Schedule 8812 for the child tax credit.
  - Names and Social Security numbers must match the Social Security cards exactly.
  - Only one person can claim the same child; don't claim a child someone else has already claimed, and check the IRS tie-breaker rules.
  - Missed the EITC before? You can still claim up to three past years, or amend with Form 1040-X.
handoff: https://www.irs.gov/e-file-do-your-taxes-for-free
