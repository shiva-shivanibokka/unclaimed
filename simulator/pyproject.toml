[project]
name = "unclaimed-simulator"
version = "0.1.0"
description = "A web stand-in for Alexa+: an Echo Show-style frame and a live voice (Amazon Nova 2 Sonic, run by a Strands agent) calling the Unclaimed MCP server"
license = "AGPL-3.0-only"
requires-python = ">=3.12"  # Strands runs Nova Sonic on 3.12+
dependencies = [
    "strands-agents[bidi]>=1.57",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
