[project]
name = "unclaimed-engine"
version = "0.1.0"
description = "Unclaimed engine: PolicyEngine-US wrapper for CA + IL benefits"
license = "AGPL-3.0-only"
requires-python = ">=3.11,<3.13"
dependencies = [
    "policyengine-us==2.18.2",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
