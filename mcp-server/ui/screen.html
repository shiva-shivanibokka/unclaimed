<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unclaimed</title>
<!-- The Echo Show screen (MCP Apps view) for get_results and get_plan. Self-contained: the
     QR library is inlined by the server where the marker below is; nothing loads from outside.
     Everything shown comes from the tool result: names and amounts from the calculator,
     plans from the agencies' pages (plan cards). Designed on Alexa's 768x480 canvas. -->
<style>
  :root { --bg: #070b16; --top: #0f1a36; --panel: rgb(255 255 255 / 0.06); --line: rgb(255 255 255 / 0.10); --text: #f3f6fb;
          --muted: #9aa7bd; --yes: #3ee0a1; --if: #ffc65c; --accent: #19d3ff; }
  :root[data-theme="light"] { --bg: #f5f7fb; --top: #f5f7fb; --panel: #ffffff; --line: #e3e7ef; --text: #0f172a; --muted: #4b5563;
          --yes: #047857; --if: #92400e; --accent: #0369a1; }
  * { box-sizing: border-box; margin: 0; }
  html { scrollbar-color: rgb(127 127 127 / 0.4) transparent; }
  body { background: radial-gradient(120% 90% at 50% 0%, var(--top), var(--bg)); color: var(--text); min-height: 100vh;
         font: 17px/1.35 "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; padding: 26px 30px 70px; }
  h1 { font-size: 30px; font-weight: 650; letter-spacing: -0.02em; }
  .summary { color: var(--muted); font-size: 15px; margin: 4px 0 18px; }
  .summary b { color: var(--text); font-weight: 600; }
  .muted { color: var(--muted); font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px 16px; position: relative; overflow: hidden; }
  .tile::before { content: ""; position: absolute; inset: 0 0 auto; height: 3px; background: var(--yes); }
  .tile.if::before { background: var(--if); }
  .badge { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--yes); }
  .tile.if .badge { color: var(--if); }
  .tile h2 { font-size: 17px; font-weight: 600; margin-top: 4px; }
  .amount { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin-top: 8px; }
  .amount small { font-size: 15px; font-weight: 500; color: var(--muted); }
  .tag { margin-top: 8px; font-size: 13px; color: var(--if); }
  .foot { margin-top: 14px; }
  .plans { display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; }
  .plan { flex: 0 0 100%; scroll-snap-align: start; display: grid; grid-template-columns: 1fr 200px; gap: 22px; }
  .plan h1 { margin-bottom: 4px; }
  .apply { margin: 14px 0 12px; padding: 12px 16px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
  .label { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); }
  .apply p { font-size: 19px; font-weight: 600; margin-top: 2px; }
  .qr { background: #fff; border-radius: 16px; padding: 12px; align-self: start; text-align: center; color: #111; font-size: 13px; font-weight: 600; }
  .qr svg { width: 100%; height: auto; display: block; margin-bottom: 4px; }
  ul { padding-left: 18px; margin-top: 4px; }
  li { margin: 3px 0; font-size: 15px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 10px; }
  h3 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  @media (max-width: 560px) { .plan, .cols { grid-template-columns: 1fr; } .qr { max-width: 220px; } }
</style>
</head>
<body>
<main id="root"><p class="muted">Getting your results…</p></main>
<script>/*QRCODE*/</script>
<script>
"use strict";
const root = document.getElementById("root");
const el = (tag, props = {}, ...kids) => {
  const n = Object.assign(document.createElement(tag), props);
  n.append(...kids.filter((k) => k != null));
  return n;
};
const money = (x) => "$" + Math.round(x).toLocaleString("en-US");
const people = (ids) => `for ${ids.length} ${ids.length === 1 ? "person" : "people"}`;

function results(r) {
  // Likely first, then "maybe" (each program's status comes with the result). Programs
  // ruled out aren't shown, so one drops off the screen once an answer rules it out.
  const maybe = (p) => p.status === "maybe";
  const shown = r.programs.filter((p) => p.status !== "no");
  const likely = shown.filter((p) => !maybe(p)), maybes = shown.filter(maybe);
  const tile = (p) => el("div", { className: "tile" + (maybe(p) ? " if" : "") },
    el("span", { className: "badge", textContent: maybe(p) ? "Maybe" : "Likely" }),
    el("h2", { textContent: p.name }),
    // No amount: the engine reports who is covered instead (health coverage).
    p.eligible && p.amount > 0
      ? el("div", { className: "amount" }, money(p.amount), el("small", { textContent: ` / ${p.per}` }))
      : el("div", { className: "amount", textContent: !p.eligible ? "Maybe" : p.amount === undefined ? "Covered" : "Qualifies" }),
    p.eligible_people ? el("div", { className: "muted", textContent: people(p.eligible_people) }) : null,
    p.if_also ? el("div", { className: "tag", textContent: `If: ${p.if_also.join(" ")}` }) : null,
    p.conditional_on ? el("div", { className: "tag", textContent: `Ask me to check ${p.name}` }) : null);
  const counts = [[likely.length, "likely"], [maybes.length, "maybe"]].filter(([n]) => n)
    .flatMap(([n, word], i) => [i ? " · " : "", el("b", { textContent: String(n) }), ` ${word}`]);
  const more = (r.also_check ?? []).map((p) => p.name).join(", ");
  return [
    el("h1", { textContent: shown.length ? "You may qualify for" : "Nothing found this time" }),
    shown.length ? el("p", { className: "summary" }, ...counts) : null,
    el("div", { className: "grid" }, ...likely.map(tile), ...maybes.map(tile)),
    more ? el("p", { className: "muted foot", textContent: `Also worth checking: ${more}` }) : null,
    r.we_assumed?.length ? el("p", { className: "muted foot", textContent: `We assumed: ${r.we_assumed.join(" ")}` }) : null,
    el("p", { className: "muted foot", textContent: "Estimates. The agency decides when you apply." }),
  ];
}

function qr(url) {
  if (typeof qrcode !== "function") return null;
  const code = qrcode(0, "M");
  code.addData(url);
  code.make();
  const box = el("div", { className: "qr" });
  box.innerHTML = code.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
  box.append(el("div", { textContent: "Scan to open on your phone" }));
  return box;
}

function list(title, items) {
  return el("section", {}, el("h3", { textContent: title }), el("ul", {}, ...items.map((t) => el("li", { textContent: t }))));
}

function plans(r) {
  return [el("div", { className: "plans" }, ...r.plans.map((p) => {
    const first = p.apply[0];
    return el("article", { className: "plan" },
      el("div", {},
        el("h1", { textContent: Object.values(p.names).join(" and ") }),
        el("p", { className: "muted", textContent: p.what }),
        el("div", { className: "apply" }, el("div", { className: "label", textContent: "Apply" }),
          el("p", { textContent: `${first.where}${first.phone ? " · " + first.phone : ""}` })),
        el("div", { className: "cols" }, list("Bring", p.bring), list("Then", p.next)),
        list("Watch out", [...(p.not_calculated ?? []), ...p.watch_out])),
      qr(p.handoff));
  }))];
}

function render(data) {
  if (!data) return;
  const view = data.plans ? plans(data) : data.programs ? results(data)
    : [el("p", { className: "muted", textContent: "A few more questions first." })]; // get_results before it's ready
  root.replaceChildren(...view.filter(Boolean));
  notify("ui/notifications/size-changed", { width: document.body.scrollWidth, height: document.body.scrollHeight });
}

// MCP Apps: JSON-RPC 2.0 over postMessage with the host (spec 2026-01-26).
let next = 0;
const waiting = new Map();
const send = (msg) => window.parent.postMessage({ jsonrpc: "2.0", ...msg }, "*");
const notify = (method, params) => send({ method, params });
const request = (method, params) => new Promise((resolve) => { waiting.set(++next, resolve); send({ id: next, method, params }); });
const theme = (ctx) => { if (ctx?.theme) document.documentElement.dataset.theme = ctx.theme; };

window.addEventListener("message", (e) => {
  if (e.source !== window.parent) return;
  const m = e.data;
  if (!m || m.jsonrpc !== "2.0") return;
  if (m.id !== undefined && waiting.has(m.id)) { waiting.get(m.id)(m.result); waiting.delete(m.id); return; }
  if (m.method === "ui/notifications/tool-result") {
    const p = m.params ?? {};
    let data = p.structuredContent;
    if (!data) { try { data = JSON.parse(p.content?.find((c) => c.type === "text")?.text); } catch { data = null; } }
    render(data);
  } else if (m.method === "ui/notifications/host-context-changed") {
    theme(m.params);
  } else if (m.method === "ui/resource-teardown" && m.id !== undefined) {
    send({ id: m.id, result: {} });
  }
});

request("ui/initialize", {
  protocolVersion: "2026-01-26",
  appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] },
  clientInfo: { name: "unclaimed-screen", version: "1" },
}).then((init) => { theme(init?.hostContext); notify("ui/notifications/initialized", {}); });
</script>
</body>
</html>
