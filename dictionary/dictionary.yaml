# The dictionary: the single source for every fact Unclaimed can be told, and for how
# every PolicyEngine input our programs read is handled. Loaded and validated by
# engine/unclaimed_engine/dictionary.py; the engine's API schema is generated from it.
#
# Every engine input the in-scope programs read (engine/unclaimed_engine/coverage.py)
# is in exactly one bucket: a question's `engine` list, `derived`, `assumed`, or
# `out_of_scope`. engine/tests/test_coverage.py enforces this.
#
# Evidence: engine/scripts/sensitivity_scan.py sets each input to a realistic value
# across CA + IL households and records which program results change. Inputs that change
# results for real households are asked, or assumed with a statement shown to the person.
#
# Units: answers arrive in engine units (money = US dollars per year). `person_units`
# lists how the person may say it; the MCP server converts. Allowed values of enum answers
# come from the engine variable itself, never listed here.
#
# what_if: [none, realistic maximum]. The Question Engine only tries these two values, so
# the maximum must reach every amount that can flip a program for a plausible household;
# engine/tests/test_what_if_ranges.py checks it (no flip between the maximum and twice it).
#
# Phrasing (definition, ask, clarifiers) never states a program rule or threshold: the AI
# could repeat a stale one. Rules live in PolicyEngine; results explain them from there.
#
# applies_when says only who could plausibly have an answer (our decision: no wages before
# 14, no pregnancy outside 12-55). Never a program rule (SNAP's elderly age, a child care
# age limit): which questions matter is the Question Engine's job, from PolicyEngine's rules.
#
# applies_when keys and on_person placements are defined (and validated) in
# engine/unclaimed_engine/dictionary.py.

# Who and where: the household's structure (Household fields, not engine inputs), asked
# first. Phrasing lives here like every question's.
structure:
  zip:
    definition: Home ZIP code. The engine finds the county from it (HUD crosswalk).
    ask: Ask for their home ZIP code.
  county:
    definition: The county they live in. Asked only when their ZIP spans more than one.
    ask: Their ZIP code covers more than one county; ask which one they live in, reading the options.
  people:
    definition: Everyone who lives and shares meals with them, with each person's age and relationship (spouse or partner, child).
    ask: Ask who lives with them, and each person's age.

questions:

  # ---- Core 1 and 2: ZIP and who lives with you are `structure` above -----------------

  # ---- Core 3: pay before taxes -------------------------------------------------------
  - id: employment_income
    entity: person
    core: true
    engine: [employment_income_before_lsr]
    definition: Wages, salary and tips from jobs, before taxes and deductions.
    ask: Ask what each working adult earns from jobs before taxes, in whatever way they know it (per paycheck and how often, or per hour and hours).
    answer: {type: money, unit: USD per year, person_units: [hour, week, two_weeks, half_month, month, year], basis: before_tax}
    what_if: [0, 60000]
    applies_when: {age_min: 14}
    cost: 2
    clarifiers:
      - Include tips, overtime and bonuses.
      - If they only know take-home pay, give it as take-home; it is converted to pay before taxes with the tax rules.

  - id: weekly_hours_worked
    entity: person
    engine: [weekly_hours_worked_before_lsr]
    definition: Average hours worked per week across all jobs.
    ask: Ask roughly how many hours a week they work.
    answer: {type: number, unit: hours per week, min: 0, max: 100}
    what_if: [0, 30]
    applies_when: {age_min: 14}
    cost: 1
    clarifiers:
      - Some benefits have a work-hours rule, so ask even when pay is low or irregular.
      - Includes self-employed and gig work, so it isn't tied to the wages question.

  # ---- Core 4: other income (asked together; map what they say to these) -------------
  - id: self_employment_income
    entity: person
    core: true
    group: other_income
    engine: [self_employment_income_before_lsr]
    definition: Net profit from self-employment, gig or business work (income minus business expenses).
    ask: Ask whether they do any self-employed or gig work, and roughly what they clear after expenses.
    answer: {type: money, unit: USD per year, person_units: [week, month, year], negative: true}
    what_if: [0, 60000]
    applies_when: {age_min: 14}
    cost: 2
    clarifiers:
      - Rideshare, delivery, cleaning, childcare in their home, selling goods.

  - id: unemployment_compensation
    entity: person
    group: other_income
    engine: [unemployment_compensation]
    definition: Unemployment insurance benefits.
    ask: Ask whether anyone gets unemployment benefits, and how much.
    answer: {type: money, unit: USD per year, person_units: [week, two_weeks, month, year]}
    what_if: [0, 60000]
    applies_when: {age_min: 16}
    cost: 1

  - id: social_security_retirement
    entity: person
    group: other_income
    engine: [social_security_retirement]
    definition: Social Security retirement benefits.
    ask: Ask whether anyone gets Social Security, which kind, and how much a month.
    answer: {type: money, unit: USD per year, person_units: [month, year]}
    what_if: [0, 60000]
    applies_when: {age_min: 18}
    cost: 1

  - id: social_security_disability
    entity: person
    group: other_income
    engine: [social_security_disability]
    definition: Social Security Disability Insurance (SSDI) benefits.
    ask: Ask whether anyone gets Social Security disability (SSDI), and how much a month.
    answer: {type: money, unit: USD per year, person_units: [month, year]}
    what_if: [0, 60000]
    applies_when: {age_min: 18}
    cost: 2
    clarifiers:
      - SSDI is not SSI. SSI is asked with benefits they already get.

  - id: social_security_survivors
    entity: person
    group: other_income
    engine: [social_security_survivors]
    definition: Social Security survivors benefits (after a parent or spouse died).
    ask: Ask whether anyone gets Social Security survivor benefits.
    answer: {type: money, unit: USD per year, person_units: [month, year]}
    what_if: [0, 60000]
    cost: 2

  - id: social_security_dependents
    entity: person
    group: other_income
    engine: [social_security_dependents]
    definition: Social Security benefits paid to someone as the dependent of a retired or disabled worker.
    ask: Ask whether a child or spouse gets Social Security because of a parent's or spouse's record.
    answer: {type: money, unit: USD per year, person_units: [month, year]}
    what_if: [0, 60000]
    cost: 2

  - id: child_support_received
    entity: person
    group: other_income
    engine: [child_support_received]
    definition: Child support actually received.
    ask: Ask whether they receive child support, and how much they actually get.
    answer: {type: money, unit: USD per year, person_units: [month, year]}
    what_if: [0, 60000]
    applies_when: {age_min: 16}
    cost: 2

  - id: alimony_income
    entity: person
    group: other_income
    engine: [alimony_income]
    definition: Alimony or spousal support received.
    ask: Ask whether they receive alimony or spousal support.
    answer: {type: money, unit: USD per year, person_units: [month, year]}
    what_if: [0, 60000]
    applies_when: {age_min: 18}
    cost: 2

  - id: pension_income
    entity: person
    group: other_income
    engine: [taxable_private_pension_income]
    definition: Pension or annuity payments from a former employer, private or government.
    ask: Ask whether anyone gets a pension.
    answer: {type: money, unit: USD per year, person_units: [month, year]}
    what_if: [0, 60000]
    applies_when: {age_min: 18}
    cost: 1

  - id: retirement_withdrawals
    entity: person
    group: other_income
    engine: [taxable_ira_distributions]
    definition: Money taken out of an IRA, 401(k) or similar retirement account.
    ask: Ask whether anyone took money out of a retirement account this year.
    answer: {type: money, unit: USD per year, person_units: [year]}
    what_if: [0, 60000]
    applies_when: {age_min: 18}
    cost: 2

  - id: interest_dividends
    entity: person
    group: other_income
    engine: [taxable_interest_income]
    definition: Interest and dividends from bank accounts and investments.
    ask: Ask whether they earn interest or dividends worth mentioning.
    answer: {type: money, unit: USD per year, person_units: [year]}
    what_if: [0, 60000]
    applies_when: {age_min: 18}
    cost: 2

  - id: rental_income
    entity: person
    group: other_income
    engine: [rental_income]
    definition: Net income from renting out property or rooms (rent received minus expenses).
    ask: Ask whether they rent out a room or property.
    answer: {type: money, unit: USD per year, person_units: [month, year], negative: true}
    what_if: [0, 60000]
    applies_when: {age_min: 18}
    cost: 2

  - id: veterans_benefits
    entity: person
    group: other_income
    engine: [veterans_benefits]
    definition: VA disability compensation or pension.
    ask: Ask whether anyone gets VA benefits.
    answer: {type: money, unit: USD per year, person_units: [month, year]}
    what_if: [0, 60000]
    applies_when: {age_min: 18}
    cost: 2

  - id: workers_compensation
    entity: person
    group: other_income
    engine: [workers_compensation]
    definition: Workers' compensation payments for a work injury.
    ask: Ask whether anyone gets workers' comp.
    answer: {type: money, unit: USD per year, person_units: [week, month, year]}
    what_if: [0, 60000]
    applies_when: {age_min: 16}
    cost: 2

  - id: disability_benefits
    entity: person
    group: other_income
    engine: [disability_benefits]
    definition: Disability payments from private insurance or an employer plan (not Social Security, not VA).
    ask: Ask whether anyone gets disability insurance payments.
    answer: {type: money, unit: USD per year, person_units: [week, month, year]}
    what_if: [0, 60000]
    applies_when: {age_min: 16}
    cost: 2

  - id: ca_state_disability_insurance
    entity: person
    group: other_income
    engine: [ca_state_disability_insurance]
    definition: California State Disability Insurance (SDI) or Paid Family Leave payments.
    ask: Ask whether anyone gets California SDI or paid family leave.
    answer: {type: money, unit: USD per year, person_units: [week, month, year]}
    what_if: [0, 60000]
    applies_when: {age_min: 16, states: [CA]}
    cost: 2

  - id: general_assistance
    entity: person
    group: other_income
    engine: [general_assistance]
    definition: County General Assistance or General Relief cash.
    ask: Ask whether anyone gets county General Assistance or General Relief.
    answer: {type: money, unit: USD per year, person_units: [month, year]}
    what_if: [0, 60000]
    applies_when: {age_min: 18}
    cost: 2

  # ---- Core 5: housing cost -----------------------------------------------------------
  - id: housing_tenure
    entity: household
    core: true
    group: housing
    engine: [spm_unit_tenure_type]
    definition: Whether the household rents, or owns with or without a mortgage.
    ask: Ask whether they rent or own their home.
    answer: {type: enum}
    what_if: [RENTER, OWNER_WITH_MORTGAGE]
    cost: 1

  - id: rent
    entity: household
    core: true
    group: housing
    engine: [pre_subsidy_rent]
    on_person: head
    definition: Rent the household pays, before any housing assistance.
    ask: Ask what the household pays in rent.
    answer: {type: money, unit: USD per year, person_units: [month, year]}
    what_if: [0, 24000]
    requires: {housing_tenure: [RENTER]}
    cost: 1

  - id: mortgage_payments
    entity: household
    group: housing
    engine: [mortgage_payments]
    definition: Mortgage principal and interest payments (property taxes and home insurance are asked separately).
    ask: For homeowners with a mortgage, ask what the mortgage payment is.
    answer: {type: money, unit: USD per year, person_units: [month, year]}
    what_if: [0, 24000]
    requires: {housing_tenure: [OWNER_WITH_MORTGAGE]}
    cost: 2
    clarifiers:
      - If taxes and insurance are bundled into the payment, ask for the split, or put the bundle here and zero for those.

  - id: property_taxes
    entity: household
    group: housing
    engine: [real_estate_taxes]
    on_person: head
    definition: Property taxes on the home.
    ask: For homeowners, ask what they pay in property taxes.
    answer: {type: money, unit: USD per year, person_units: [month, year]}
    what_if: [0, 6000]
    requires: {housing_tenure: [OWNER_WITH_MORTGAGE, OWNER_WITHOUT_MORTGAGE]}
    cost: 2

  - id: home_insurance
    entity: household
    group: housing
    engine: [homeowners_insurance]
    definition: Homeowners insurance premiums.
    ask: For homeowners, ask what they pay for home insurance.
    answer: {type: money, unit: USD per year, person_units: [month, year]}
    what_if: [0, 2400]
    requires: {housing_tenure: [OWNER_WITH_MORTGAGE, OWNER_WITHOUT_MORTGAGE]}
    cost: 1

  # ---- Utilities ----------------------------------------------------------------------
  - id: heating_type
    entity: household
    group: home_energy
    group: utilities
    engine: [heating_type]
    definition: The fuel used most to heat the home.
    ask: Ask what they mainly heat their home with.
    answer: {type: enum}
    what_if: [NONE, NATURAL_GAS]
    cost: 1
    clarifiers:
      - A heating or cooling cost qualifies a household for SNAP's full utility allowance.

  - id: heat_included_in_rent
    entity: household
    group: utilities
    engine: [heat_expense_included_in_rent]
    definition: Heat is included in the rent rather than paid separately.
    ask: Ask whether heat is included in their rent.
    answer: {type: bool}
    what_if: [false, true]
    requires: {housing_tenure: [RENTER]}
    cost: 1

  - id: pays_for_cooling
    entity: household
    group: home_energy
    group: utilities
    engine: [has_cooling_expense]
    definition: Pays for air conditioning or other cooling separately from rent.
    ask: Ask whether they pay for air conditioning.
    answer: {type: bool}
    what_if: [false, true]
    cost: 1

  - id: electricity_bill
    entity: household
    group: home_energy
    group: utilities
    engine: [pre_subsidy_electricity_expense]
    definition: Electricity bill, before any discount.
    ask: Ask roughly what their electric bill is.
    answer: {type: money, unit: USD per year, person_units: [month, year]}
    what_if: [0, 2400]
    cost: 1
    clarifiers:
      - Sets the size of the CARE and FERA discounts in California.

  - id: gas_bill
    entity: household
    group: home_energy
    group: utilities
    engine: [gas_expense]
    definition: Natural gas bill, before any discount.
    ask: Ask roughly what their gas bill is.
    answer: {type: money, unit: USD per year, person_units: [month, year]}
    what_if: [0, 1800]
    cost: 1
    clarifiers:
      - Sets the size of the CARE gas discount in California.

  - id: phone_bill
    entity: household
    group: utilities
    engine: [phone_cost]
    definition: Phone bill (landline or cell).
    ask: Ask what they pay for phone service.
    answer: {type: money, unit: USD per year, person_units: [month, year]}
    what_if: [0, 1200]
    cost: 1
    clarifiers:
      - Sets the size of the Lifeline discount.

  - id: internet_bill
    entity: household
    group: utilities
    engine: [broadband_cost]
    definition: Home internet bill.
    ask: Ask what they pay for home internet.
    answer: {type: money, unit: USD per year, person_units: [month, year]}
    what_if: [0, 900]
    cost: 1

  # ---- Circumstances ------------------------------------------------------------------
  - id: is_pregnant
    entity: person
    engine: [is_pregnant]
    definition: Currently pregnant.
    ask: Ask whether anyone in the household is pregnant.
    answer: {type: bool}
    what_if: [false, true]
    applies_when: {age_min: 12, age_max: 55}
    cost: 3

  - id: is_disabled
    entity: person
    group: disability
    engine: [is_disabled, meets_ssi_disability_criteria]
    definition: Has a physical or mental condition expected to last a year or more that keeps them from working, or limits the work they can do.
    ask: Ask whether anyone has a disability or long-term health condition that keeps them from working.
    answer: {type: bool}
    what_if: [false, true]
    cost: 3
    clarifiers:
      - Also counts as SSI's disability test, which PolicyEngine keeps as a separate input.

  - id: is_blind
    entity: person
    group: disability
    engine: [is_blind]
    definition: Legally blind.
    ask: Ask together with disability whether anyone is legally blind.
    answer: {type: bool}
    what_if: [false, true]
    cost: 3

  - id: immigration_status
    entity: person
    engine: [immigration_status, immigration_status_str]
    definition: Current U.S. immigration status.
    ask: Only if it could change a result, ask gently about immigration status, and say that the answer isn't stored or shared.
    answer: {type: enum}
    what_if: [CITIZEN, UNDOCUMENTED]
    cost: 5
    clarifiers:
      - Never required; "prefer not to say" is fine and is recorded as declined.
      - Also decides whether the person has an SSN valid for work, which federal tax credits require (derived).

  - id: years_in_us
    entity: person
    engine: [years_since_us_entry]
    definition: Years since entering the U.S. or getting the current qualified immigration status, whichever is later.
    ask: For non-citizens, ask how long they've had their current status.
    answer: {type: number, unit: years, min: 0, max: 100}
    what_if: [1, 10]
    applies_when: {non_citizen: true}
    requires: [immigration_status]
    cost: 3
    clarifiers:
      - Some benefits depend on how long a lawful permanent resident has had that status.

  - id: work_quarters
    entity: person
    engine: [ssi_qualifying_quarters_earnings]
    definition: Quarters (3-month periods) of U.S. work history, counting a spouse's or parents' work where the rules allow.
    ask: For non-citizen adults, ask roughly how many years they (or their spouse) have worked in the U.S.; each year is 4 quarters.
    answer: {type: number, unit: quarters, min: 0, max: 400}
    what_if: [0, 40]
    applies_when: {non_citizen: true}
    requires: [immigration_status]
    cost: 3
    clarifiers:
      - Enough U.S. work history can let some lawful permanent residents get SSI or SNAP sooner.

  - id: is_full_time_college_student
    entity: person
    engine: [is_full_time_college_student]
    definition: Enrolled full-time in college, university or a vocational program.
    ask: Ask whether anyone in the household is a full-time college student.
    answer: {type: bool}
    what_if: [false, true]
    applies_when: {age_min: 16}
    cost: 1
    clarifiers:
      - A full-time student can still be claimed as a dependent child for longer than other adult children.

  - id: is_part_time_college_student
    entity: person
    engine: [is_part_time_college_student]
    definition: Enrolled at least half-time (but not full-time) in college, university or a vocational program.
    ask: If someone is in college but not full-time, ask whether it's at least half-time.
    answer: {type: bool}
    what_if: [false, true]
    applies_when: {age_min: 16}
    cost: 1
    clarifiers:
      - SNAP's student rule applies to anyone enrolled at least half-time.

  - id: has_job_health_insurance
    entity: person
    engine: [has_esi]
    definition: Covered by health insurance through their own or a family member's job.
    ask: Ask whether anyone has health insurance through a job.
    answer: {type: bool}
    what_if: [false, true]
    cost: 1

  - id: savings
    entity: household
    engine: [bank_account_assets]
    on_person: head
    definition: Money in checking, savings and money market accounts, and cash on hand.
    ask: Ask roughly how much the household has in the bank and in cash.
    answer: {type: money, unit: USD, person_units: [total]}
    what_if: [0, 200000]
    cost: 3
    clarifiers:
      - A balance for the whole household, not a yearly amount.

  # ---- Expenses -----------------------------------------------------------------------
  - id: childcare_expenses
    entity: household
    engine: [spm_unit_pre_subsidy_childcare_expenses]
    definition: What the household pays out of pocket for child care so adults can work or study.
    ask: Ask what they pay for child care.
    answer: {type: money, unit: USD per year, person_units: [week, month, year]}
    what_if: [0, 24000]
    cost: 2

  - id: child_support_paid
    entity: person
    engine: [child_support_expense]
    definition: Court-ordered child support paid to someone outside the household.
    ask: Ask whether anyone pays child support to someone outside the home.
    answer: {type: money, unit: USD per year, person_units: [month, year]}
    what_if: [0, 24000]
    applies_when: {age_min: 18}
    cost: 2

  - id: medical_expenses
    entity: person
    engine: [other_medical_expenses]
    definition: This person's out-of-pocket medical costs (not covered by insurance).
    ask: Ask about each person's out-of-pocket medical costs (premiums, prescriptions, bills not covered by insurance).
    answer: {type: money, unit: USD per year, person_units: [month, year]}
    what_if: [0, 24000]
    cost: 2

  # ---- Benefits already received ------------------------------------------------------
  - id: receives_ssi
    entity: person
    group: current_benefits
    engine: [receives_ssi]
    definition: Currently receives SSI.
    ask: Ask which benefits the household already gets.
    answer: {type: bool}
    what_if: [false, true]
    cost: 1

  - id: receives_medicaid
    entity: person
    group: current_benefits
    engine: [receives_medicaid]
    definition: Currently has Medicaid (Medi-Cal in California).
    ask: Ask which benefits the household already gets.
    answer: {type: bool}
    what_if: [false, true]
    cost: 1

  - id: receives_tanf
    entity: household
    group: current_benefits
    engine: [receives_tanf]
    definition: Currently receives cash aid (CalWORKs in California, TANF in Illinois).
    ask: Ask which benefits the household already gets.
    answer: {type: bool}
    what_if: [false, true]
    cost: 1

  - id: receives_snap
    entity: household
    group: current_benefits
    engine: [receives_snap]
    definition: Currently receives SNAP (CalFresh in California).
    ask: Ask which benefits the household already gets.
    answer: {type: bool}
    what_if: [false, true]
    cost: 1

  - id: receives_housing_assistance
    entity: household
    group: current_benefits
    engine: [receives_housing_assistance]
    definition: Currently receives housing assistance (Section 8 voucher, public housing).
    ask: Ask which benefits the household already gets.
    answer: {type: bool}
    what_if: [false, true]
    cost: 1

# Set by our code from the household's structure (and, for tenant_pays_utilities, from
# an answer). Each has an implementation in engine/unclaimed_engine/calculate.py
# (DERIVERS); tests check both directions.
derived:
  age: stated for each person (structure)
  state_code: the household's state
  county: the given county, or from the ZIP (HUD crosswalk)
  zip_code: the given ZIP
  ssn_card_type: from immigration_status (citizen -> citizen's SSN; undocumented -> none; other statuses -> SSN valid for work); unknown status follows the engine's citizen default
  living_arrangements_allow_for_food_preparation: assumed True (the home has a kitchen), stated on the results screen
  county_fips: from the county, via PolicyEngine's own county table
  state_fips: from the state, via PolicyEngine's own county table
  is_tax_unit_head: from relationship (head; adult children not claimed file their own return)
  is_tax_unit_spouse: from relationship
  is_tax_unit_dependent: children under 19, full-time students under 24, or disabled
  tax_unit_id: each tax unit's position, from 1 (0 means "no claiming unit" to the engine)
  medicaid_claiming_tax_unit_id: the tax unit that claims the person
  is_household_head: from relationship
  is_related_to_head_or_spouse: everyone in a v1 household is related (head, spouse, children)
  own_children_in_household: number of children, for the head and spouse
  cohabitating_spouses: a spouse lives in the household
  tenant_pays_utilities: pays an electricity or gas bill of their own (unset when neither is known)

assumed:
  - reason: Screening estimates what the household would get by applying.
    statement: These estimates assume you apply for each program you qualify for, and file a tax return to get tax credits.
    engine: [takes_up_snap_if_eligible, takes_up_ssi_if_eligible, takes_up_tanf_if_eligible, takes_up_wic_if_eligible,
             takes_up_eitc, takes_up_medicaid_if_eligible, takes_up_medicare_if_eligible, takes_up_head_start_if_eligible,
             takes_up_early_head_start_if_eligible, takes_up_housing_assistance_if_eligible, takes_up_chip_if_eligible,
             would_file_if_eligible_for_refundable_credit, would_file_taxes_voluntarily]

  - reason: Rare for this audience; the other-income question invites them to mention anything else.
    statement: We assumed no income beyond what you told us (for example investment sales, a business partnership, farm income, or gambling winnings).
    engine: [debt_relief, estate_income, farm_operations_income, farm_rent_income, financial_assistance, gambling_winnings,
             gi_cash_assistance, illicit_income, keogh_distributions, long_term_capital_gains_before_response,
             long_term_capital_gains_on_collectibles, long_term_capital_gains_on_small_business_stock, military_service_income,
             miscellaneous_income, non_qualified_dividend_income, qualified_dividend_income, non_sch_d_capital_gains,
             other_net_gain, partnership_income, partnership_self_employment_net_earnings, passive_partnership_s_corp_income,
